[project]
name = "yisuite-access"
version = "0.1.0"
description = "One way for every Yisuite app to decide who may do what (Eve decides; apps enforce)."
requires-python = ">=3.9"
dependencies = ["PyJWT[crypto]>=2.8", "requests>=2.31"]

[project.optional-dependencies]
flask = ["Flask>=2.3"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yisuite_access*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
